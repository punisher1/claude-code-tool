# .github/release.yml
# Configuration for automatically generated release notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octobot
      - dependabot
  categories:
    - title: '🚀 Features'
      labels:
        - 'feature'
        - 'enhancement'
    - title: '🐛 Bug Fixes'
      labels:
        - 'bug'
        - 'fix'
        - 'bugfix'
    - title: '📚 Documentation'
      labels:
        - 'documentation'
        - 'docs'
    - title: '🔧 Maintenance'
      labels:
        - 'chore'
        - 'maintenance'
        - 'refactor'
    - title: '⬆️ Dependencies'
      labels:
        - 'dependencies'
    - title: '✅ Tests'
      labels:
        - 'test'
        - 'testing'
    - title: '🔒 Security'
      labels:
        - 'security'
    - title: 'Other Changes'
      labels:
        - '*'
